<html>

<head>
  <title>Multimedia Example</title>
</head>

<body style="font-family: Arial; text-align: center; background-color: #f2f2f2; padding: 20px;">

  <h1>Multimedia in HTML</h1>

  <h2>IFrame</h2>
  <iframe src="https://www.youtube.com/embed/BDkn3nYuUDY" width="800" height="400"
    style="border:2px solid black;"></iframe>

  <h2>Audio</h2>
  <audio controls>
    <source src="Lalpari.unknown" type="audio/mpeg">
  </audio>

  <h2>Video Example</h2>
  <video width="800" height="500" controls>
    <source src="john wick.mp4" type="video/mp4">
  </video>

</body>

</html>
